name: Documentation closeout
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    name: Reader paths (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reader paths and documentation negatives (offline)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/test-documentation-closeout.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(git status --porcelain --untracked-files=all).Count) { throw 'Documentation tests changed checkout' }
